services:
  - type: web
    name: fastfood-api
    runtime: node
    plan: free
    region: frankfurt
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: fastfood-db
          property: connectionString
      - key: CORS_ORIGIN
        value: https://fastfood-vue.onrender.com
  - type: web
    name: fastfood-vue
    runtime: static
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        value: https://fastfood-api.onrender.com
databases:
  - name: fastfood-db
    plan: free
    region: frankfurt
    databaseName: fastfood
    user: fastfood
