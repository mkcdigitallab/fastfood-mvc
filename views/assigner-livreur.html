<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Assigner un livreur - Gérant</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header class="topbar">
    <div class="logo">Fast<span>Food</span></div>
    <div>Espace Gérant</div>
  </header>

  <div class="container">
    <div class="card">
      <h1>🛵 Assigner un livreur</h1>
      <p>Scénario 4 — Commande #12 prête à être expédiée.</p>

      <div class="rdv-item">
        <div class="details">
          <div><strong>Commande #12</strong> — Malang Kiya Ciss</div>
          <span class="badge reserve">En préparation</span>
        </div>
      </div>

      <label>Livreurs disponibles</label>
      <div class="medecin-item">
        <div>
          <div class="nom">Ibrahima Sarr</div>
          <div class="specialite">Statut : Disponible</div>
        </div>
        <button class="primary" style="margin:0;">Assigner</button>
      </div>
      <div class="medecin-item">
        <div>
          <div class="nom">Ousmane Ba</div>
          <div class="specialite">Statut : Disponible</div>
        </div>
        <button class="primary" style="margin:0;">Assigner</button>
      </div>

      <div class="notif-banner">✅ Livreur Ibrahima Sarr assigné — commande passée à "En livraison", livreur notifié</div>
    </div>
  </div>
</body>
</html>
