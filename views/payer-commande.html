<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Payer ma commande</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header class="topbar">
    <div class="logo">Fast<span>Food</span></div>
    <div>Malang Kiya Ciss</div>
  </header>

  <div class="container">
    <div class="card">
      <h1>💳 Payer ma commande</h1>
      <p>Scénario 2 — Commande #12, statut "En attente", 10 000 FCFA</p>

      <label>Numéro de carte</label>
      <input type="text" placeholder="•••• •••• •••• ••••" value="4532 •••• •••• 1189">

      <div class="row">
        <div>
          <label>Date d'expiration</label>
          <input type="text" placeholder="MM/AA" value="09/28">
        </div>
        <div>
          <label>CVV</label>
          <input type="text" placeholder="•••" value="•••">
        </div>
      </div>

      <button class="primary">Payer 10 000 FCFA</button>
    </div>

    <div class="card">
      <h1 style="font-size:1.1rem;">Reçu de paiement</h1>
      <div class="rdv-item">
        <div class="details">
          <div><strong>Commande #12</strong></div>
          <div>Transaction : TXN-20260706-9931</div>
          <span class="badge libre">Payée</span>
        </div>
        <div>10 000 FCFA</div>
      </div>
      <div class="notif-banner">✅ Paiement confirmé par le système bancaire</div>
    </div>
  </div>
</body>
</html>
